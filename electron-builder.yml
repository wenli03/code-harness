appId: app.codeharness.desktop
productName: Code Harness
copyright: Copyright © 2026 code-harness contributors

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**
  - package.json

asar: true

# 内置技能包（第三方技能，见 skill-packs/README.md）不进 asar：
# 安装技能包是把它整包**复制**到用户项目里，放在 asar 内读不到普通文件路径。
extraResources:
  - from: skill-packs
    to: skill-packs
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  category: Development
